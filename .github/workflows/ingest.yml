# DAILY ingest — API-free. Fetch all Illinois feeds, append to the archive.
name: ingest
on:
  schedule:
    - cron: "20 10 * * *"     # daily 10:20 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch feeds -> archive
        run: python3 fetch_feeds.py
      - name: Commit archive growth
        run: |
          git config user.name "il-ingest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add items_archive.jsonl item_sightings.jsonl ingest_runs.jsonl archive_watermark.json || true
          git commit -m "ingest $(date -u +%F)" || echo "nothing new"
          git push || echo "push skipped"
